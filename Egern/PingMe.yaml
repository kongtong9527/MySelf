author: "怎么肥事"
icon: "antenna.radiowaves.left.and.right"

scriptings:
  - http_request:
      name: "PingMe 抓包"
      match: "^https://api\\.pingmeapp\\.net/app/queryBalanceAndBonus"
      script_url: "http://192.168.11.132:5500/Egern/PingMe.js"
      timeout: 30
  - schedule:
      name: "PingMe签到"
      cron: "30 8,20 * * *"
      script_url: "http://192.168.11.132:5500/Egern/PingMe.js"
      timeout: 120

mitm:
  hostnames:
    includes:
      - "api.pingmeapp.net"
